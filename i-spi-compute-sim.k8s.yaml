# =============================================================================
# i-spi-compute-SIM 1.3.2 -- second compute tier (namespace: madi-preprod)
#   api + worker + its own Redis; I-SPI sends jobs here for studies whose
#   `compute_cluster` setting is "sim" (ISPI_COMPUTE_URL__SIM ->
#   /i-spi-compute-sim). Same images as i-spi-compute; writes to the SAME
#   database.
#
# Differs from i-spi-compute.k8s.yaml only in: every name and `app:` label
# (i-spi-compute-sim-*), its own Redis, REDIS_HOST, ROOT_PATH and the Ingress
# path (/i-spi-compute-sim).
#
# This is the TEMPLATE kept in the public repo; the deployed copy fills in
# <DB_HOST>. The secret i-spi-compute (API_KEY, REDIS_AUTH) is
# defined in the deployed i-spi-compute.k8s.yaml and only referenced here.
# DB login: ConfigMap app-config (key ISPI_DB_USER); password: secret madi
# (key DB_PASSWORD), shared with I-SPI.
# Images: ghcr.io/immunoplex/i-spi-compute-{api,worker}:<X.Y.Z>, built from
# v* tags. Rollback: the previous X.Y.Z tag.
# =============================================================================
---
# ─────────────────────────────────────────────────────────────────────────────
# Redis (dedicated queue for the SIM stack)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i-spi-compute-sim-redis
  namespace: madi-preprod
  labels: { app: i-spi-compute-sim-redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: i-spi-compute-sim-redis }
  template:
    metadata:
      labels: { app: i-spi-compute-sim-redis }
    spec:
      imagePullSecrets: [{ name: regcred }]
      containers:
        - name: i-spi-compute-sim-redis
          image: redis:7
          imagePullPolicy: IfNotPresent
          args: ["--requirepass", "$(REDIS_AUTH)"]
          env:
            - name: REDIS_AUTH
              valueFrom: { secretKeyRef: { name: i-spi-compute, key: REDIS_AUTH } }   # SAME secret, separate instance
          ports:
            - { containerPort: 6379, name: redis, protocol: TCP }
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: i-spi-compute-sim-redis
  namespace: madi-preprod
spec:
  selector: { app: i-spi-compute-sim-redis }
  ports:
    - { port: 6379, targetPort: 6379, protocol: TCP, name: redis }
---
# ─────────────────────────────────────────────────────────────────────────────
# API (FastAPI)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i-spi-compute-sim-api
  namespace: madi-preprod
  labels: { app: i-spi-compute-sim-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: i-spi-compute-sim-api }
  template:
    metadata:
      labels: { app: i-spi-compute-sim-api }
    spec:
      imagePullSecrets: [{ name: regcred }]
      containers:
        - name: i-spi-compute-sim-api
          image: ghcr.io/immunoplex/i-spi-compute-api:1.3.2
          imagePullPolicy: Always
          env:
            - { name: REDIS_HOST, value: i-spi-compute-sim-redis }   # <-- dedicated SIM Redis
            - { name: REDIS_PORT, value: "6379" }
            - { name: REDIS_DB,   value: "0" }
            - name: REDIS_AUTH
              valueFrom: { secretKeyRef: { name: i-spi-compute, key: REDIS_AUTH } }
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: i-spi-compute, key: API_KEY } }
            - { name: ROOT_PATH,  value: /i-spi-compute-sim }         # <-- must match the SIM Traefik prefix
          ports:
            - { containerPort: 8000, name: http, protocol: TCP }
          readinessProbe:
            httpGet: { path: /health, port: 8000, scheme: HTTP }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: i-spi-compute-sim-api
  namespace: madi-preprod
spec:
  selector: { app: i-spi-compute-sim-api }
  ports:
    - { port: 8000, targetPort: 8000, protocol: TCP, name: http }
---
# ─────────────────────────────────────────────────────────────────────────────
# Worker (Python supervisor + R curveR engine)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i-spi-compute-sim-worker
  namespace: madi-preprod
  labels: { app: i-spi-compute-sim-worker }
spec:
  replicas: 1                       # scale this up for the big run (see notes)
  selector:
    matchLabels: { app: i-spi-compute-sim-worker }
  template:
    metadata:
      labels: { app: i-spi-compute-sim-worker }
    spec:
      imagePullSecrets: [{ name: regcred }]
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: i-spi-compute-sim-worker
          image: ghcr.io/immunoplex/i-spi-compute-worker:1.3.2
          imagePullPolicy: Always
          env:
            - { name: REDIS_HOST, value: i-spi-compute-sim-redis }   # <-- dedicated SIM Redis
            - { name: REDIS_PORT, value: "6379" }
            - { name: REDIS_DB,   value: "0" }
            - name: REDIS_AUTH
              valueFrom: { secretKeyRef: { name: i-spi-compute, key: REDIS_AUTH } }
            # --- database (SAME physical DB + credential as prod — see caution) ---
            - { name: DB_NAME,    value: postgres }
            - { name: DB_HOST,    value: <DB_HOST> }
            - { name: DB_PORT,    value: "5432" }
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: app-config, key: ISPI_DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: madi, key: DB_PASSWORD } }
            - { name: DB_SSLMODE, value: require }
            - { name: PROGRESS_DIR, value: /tmp }
            - { name: WORKER_CORES, value: "16" }   # MUST equal the CPU limit below
          resources:
            requests: { cpu: "1",  memory: 2Gi }
            limits:   { cpu: "16", memory: 16Gi }   # keep == WORKER_CORES
---
# ─────────────────────────────────────────────────────────────────────────────
# Ingress -- REQUIRED: I-SPI reaches this stack at /i-spi-compute-sim.
# Uses the Traefik file-provider middleware i-spi-compute-sim-stripprefix.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: i-spi-compute-sim
  namespace: madi-preprod
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: i-spi-compute-sim-stripprefix@file
spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: "/i-spi-compute-sim"
        backend:
          service:
            name: i-spi-compute-sim-api
            port:
              number: 8000
---
