# =============================================================================
# i-spi-compute 1.1.1 -- compute tier (namespace: madi-preprod)
#   api + worker + dedicated Redis; I-SPI posts jobs to /i-spi-compute.
#   Worker image: curveRcore 0.7.0, curveRfreq 0.5.2, curveRbayes 0.5.2,
#   curveRweights 0.3.0, CmdStan 2.40.0; database at calib schema 0.7.0
#   (worker/migrations/ up to 011).
#
# This is the TEMPLATE kept in the public repo. The deployed copy lives in the
# cluster's private config repo and differs only in:
#   - <DB_HOST>, <DB_USER>: the database host and user;
#   - the SealedSecret `i-spi-compute` (API_KEY, REDIS_AUTH), which is defined
#     in the deployed copy of THIS file only and reused by i-spi-compute-sim and
#     I-SPI. Create and seal it as described in SECRETS.md.
# The DB password comes from the existing secret madi-lumi-reader (key db_pwd_x).
#
# Also needed: a Traefik route /i-spi-compute -> Service i-spi-compute-api:8000
# with a stripprefix middleware (DEPLOYMENT.md).
# Images: ghcr.io/immunoplex/i-spi-compute-{api,worker}:<X.Y.Z>, built from
# v* tags. Rollback: the previous X.Y.Z tag.
# =============================================================================
---
# SealedSecret `i-spi-compute` (API_KEY, REDIS_AUTH) goes here in the deployed
# copy; see SECRETS.md. It is not kept in this public template.
---
# ─────────────────────────────────────────────────────────────────────────────
# Redis (dedicated queue for this stack)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i-spi-compute-redis
  namespace: madi-preprod
  labels: { app: i-spi-compute-redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: i-spi-compute-redis }
  template:
    metadata:
      labels: { app: i-spi-compute-redis }
    spec:
      imagePullSecrets: [{ name: regcred }]
      containers:
        - name: i-spi-compute-redis
          image: redis:7
          imagePullPolicy: IfNotPresent
          args: ["--requirepass", "$(REDIS_AUTH)"]
          env:
            - name: REDIS_AUTH
              valueFrom: { secretKeyRef: { name: i-spi-compute, key: REDIS_AUTH } }
          ports:
            - { containerPort: 6379, name: redis, protocol: TCP }
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: i-spi-compute-redis
  namespace: madi-preprod
spec:
  selector: { app: i-spi-compute-redis }
  ports:
    - { port: 6379, targetPort: 6379, protocol: TCP, name: redis }
---
# ─────────────────────────────────────────────────────────────────────────────
# API (FastAPI)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i-spi-compute-api
  namespace: madi-preprod
  labels: { app: i-spi-compute-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: i-spi-compute-api }
  template:
    metadata:
      labels: { app: i-spi-compute-api }
    spec:
      imagePullSecrets: [{ name: regcred }]
      containers:
        - name: i-spi-compute-api
          image: ghcr.io/immunoplex/i-spi-compute-api:1.1.1
          imagePullPolicy: Always
          env:
            - { name: REDIS_HOST, value: i-spi-compute-redis }   # <-- new dedicated Redis
            - { name: REDIS_PORT, value: "6379" }
            - { name: REDIS_DB,   value: "0" }
            - name: REDIS_AUTH
              valueFrom: { secretKeyRef: { name: i-spi-compute, key: REDIS_AUTH } }
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: i-spi-compute, key: API_KEY } }
            - { name: ROOT_PATH,  value: /i-spi-compute }          # <-- must match the Traefik ingress prefix (/i-spi-compute)
          ports:
            - { containerPort: 8000, name: http, protocol: TCP }
          readinessProbe:
            httpGet: { path: /health, port: 8000, scheme: HTTP }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: i-spi-compute-api
  namespace: madi-preprod
spec:
  selector: { app: i-spi-compute-api }
  ports:
    - { port: 8000, targetPort: 8000, protocol: TCP, name: http }
---
# ─────────────────────────────────────────────────────────────────────────────
# Worker (Python supervisor + R curveR engine)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i-spi-compute-worker
  namespace: madi-preprod
  labels: { app: i-spi-compute-worker }
spec:
  replicas: 1                       # scale = more workers popping the same queue
  selector:
    matchLabels: { app: i-spi-compute-worker }
  template:
    metadata:
      labels: { app: i-spi-compute-worker }
    spec:
      imagePullSecrets: [{ name: regcred }]
      nodeSelector:
        kubernetes.io/arch: amd64   # Stan models are precompiled for amd64
      containers:
        - name: i-spi-compute-worker
          image: ghcr.io/immunoplex/i-spi-compute-worker:1.1.1
          imagePullPolicy: Always
          env:
            - { name: REDIS_HOST, value: i-spi-compute-redis }   # <-- new dedicated Redis
            - { name: REDIS_PORT, value: "6379" }
            - { name: REDIS_DB,   value: "0" }
            - name: REDIS_AUTH
              valueFrom: { secretKeyRef: { name: i-spi-compute, key: REDIS_AUTH } }
            # --- database ---
            - { name: DB_NAME,    value: postgres }
            - { name: DB_HOST,    value: <DB_HOST> }
            - { name: DB_PORT,    value: "5432" }
            - { name: DB_USER,    value: <DB_USER> }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: madi-lumi-reader, key: db_pwd_x } }
            - { name: DB_SSLMODE, value: require }
            - { name: PROGRESS_DIR, value: /tmp }
            # --- CPU cap: MUST equal the CPU limit below (detectCores is not
            #     cgroup-aware). Also caps Stan parallel_chains. ---
            - { name: WORKER_CORES, value: "16" }
          resources:
            requests: { cpu: "1",  memory: 2Gi }
            limits:   { cpu: "16",  memory: 16Gi }   # tune to study size; keep == WORKER_CORES

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: i-spi-compute
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: i-spi-compute-stripprefix@file
spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: "/i-spi-compute"
        backend:
          service:
            name: i-spi-compute-api
            port:
              number: 8000
---
