name: Build and publish API image
on:
  push:
    branches: ['main']
    paths:
      - 'api/**'
      - '.github/workflows/build-api.yml'
    # Version tags produce a semver-tagged image (see the metadata step below).
    # Path filters are NOT evaluated for tag pushes, so a `vX.Y.Z` tag always
    # builds regardless of what its commit touched. The branches filter must stay
    # or branch pushes would stop triggering once a tags filter is present.
    # NOTE: api and worker share this repo, so one `vX.Y.Z` repo tag fires BOTH
    # build-api.yml and build-worker.yml — you get matching-versioned images.
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/i-spi-compute-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Branch pushes -> :main (unchanged). Tag vX.Y.Z -> :X.Y.Z and :X.Y.
          # latest=false: don't auto-move a :latest tag (preprod pins explicit
          # versions in the manifest). Flip to latest=auto if you want :latest.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cluster runs amd64 nodes (worker is amd64-only for Stan); keep API to match.
          platforms: linux/amd64

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
