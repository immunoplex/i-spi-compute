name: Build and publish Worker image
on:
  push:
    branches: ['main']
    paths:
      - 'worker/**'
      - '.github/workflows/build-worker.yml'
    # Version tags produce a semver-tagged image (see the metadata step below).
    # Path filters are NOT evaluated for tag pushes, so a `vX.Y.Z` tag always
    # builds regardless of what its commit touched. The branches filter must stay
    # or branch pushes would stop triggering once a tags filter is present.
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/i-spi-compute-worker
  # Per-package curveR pins (passed as --build-arg). The load-bearing trio is
  # pinned to v0.4.1 release tags for reproducibility (fixes the pcov_pass
  # threshold bug -- see curveRcore/curveRfreq/curveRbayes NEWS.md);
  # curveRweights tracks main. Set any to 'main' to track a branch instead of
  # a tag.
  #
  # NOTE: the "Resolve curveR refs to commit SHAs" step below MUST actually
  # read these vars per package. It previously hardcoded refs/heads/main for
  # every package regardless of what's set here -- fixed 2026-09; if you're
  # diffing against an older copy of this file, make sure that fix carried
  # over too, or these pins are silently ignored again.
  CURVERCORE_REF: v0.4.1
  CURVERFREQ_REF: v0.4.1
  CURVERBAYES_REF: v0.4.1
  CURVERWEIGHTS_REF: main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve curveR refs to commit SHAs
        id: refs
        run: |
          echo "### Resolved curveR refs (configured ref -> SHA)" >> "$GITHUB_STEP_SUMMARY"
          echo '| package | ref | commit |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          for pkg in curveRcore curveRfreq curveRbayes curveRweights; do
            # e.g. pkg=curveRcore -> ref_var=CURVERCORE_REF -> read that env var.
            # (GitHub Actions exposes workflow-level `env:` entries as real
            # shell env vars in `run:` steps, so this indirect expansion works.)
            ref_var="${pkg^^}_REF"
            ref="${!ref_var:-}"
            if [ -z "$ref" ]; then
              echo "::error::no ref configured for $pkg (expected env var $ref_var)"
              exit 1
            fi

            repo="https://github.com/immunoplex/$pkg.git"
            sha=""
            # Try, in order: peeled annotated tag -> lightweight tag -> branch
            # -> bare pattern match. This ensures annotated tags (git tag -a,
            # which is what our release scripts create) resolve to the COMMIT
            # they point to, not the tag object's own SHA.
            for candidate in "refs/tags/${ref}^{}" "refs/tags/${ref}" "refs/heads/${ref}" "${ref}"; do
              sha=$(git ls-remote "$repo" "$candidate" 2>/dev/null | awk '{print $1}' | head -n1)
              [ -n "$sha" ] && break
            done

            if [ -z "$sha" ]; then
              echo "::error::could not resolve ref '$ref' for $pkg (empty SHA) — does that tag/branch exist? is the repo private or renamed?"
              exit 1
            fi
            echo "$pkg@$ref -> $sha"
            echo "$pkg=$sha" >> "$GITHUB_OUTPUT"
            echo "| $pkg | \`$ref\` | \`$sha\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Branch pushes -> :main (unchanged). Tag vX.Y.Z -> :X.Y.Z and :X.Y.
          # latest=false: don't auto-move a :latest tag (preprod pins explicit
          # versions in the manifest). Flip to latest=auto if you want :latest.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          file: ./worker/worker.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            CURVERCORE_REF=${{ steps.refs.outputs.curveRcore }}
            CURVERFREQ_REF=${{ steps.refs.outputs.curveRfreq }}
            CURVERBAYES_REF=${{ steps.refs.outputs.curveRbayes }}
            CURVERWEIGHTS_REF=${{ steps.refs.outputs.curveRweights }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
