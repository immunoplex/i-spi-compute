name: Build and publish Worker image
on:
  push:
    branches: ['main']
    paths:
      - 'worker/**'
      - '.github/workflows/build-worker.yml'
    # Version tags produce a semver-tagged image (see the metadata step below).
    # Path filters are NOT evaluated for tag pushes, so a `vX.Y.Z` tag always
    # builds regardless of what its commit touched. The branches filter must stay
    # or branch pushes would stop triggering once a tags filter is present.
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/i-spi-compute-worker
  # Per-package curveR pins (passed as --build-arg). The load-bearing trio is
  # pinned to v0.4.0 release tags for reproducibility; curveRweights tracks main.
  # PREREQUISITE: these tags must exist on the respective repos before this
  # builds — curveRcore v0.4.0 (done), curveRbayes v0.4.0, and curveRfreq v0.4.0
  # (tag its current main in lockstep). Set any to 'main' to track a branch
  # instead of a tag.
  CURVERCORE_REF: main
  CURVERFREQ_REF: main
  CURVERBAYES_REF: main
  CURVERWEIGHTS_REF: main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Branch pushes -> :main (unchanged). Tag vX.Y.Z -> :X.Y.Z and :X.Y.
          # latest=false: don't auto-move a :latest tag (preprod pins explicit
          # versions in the manifest). Flip to latest=auto if you want :latest.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          file: ./worker/worker.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            CURVERCORE_REF=${{ env.CURVERCORE_REF }}
            CURVERFREQ_REF=${{ env.CURVERFREQ_REF }}
            CURVERBAYES_REF=${{ env.CURVERBAYES_REF }}
            # CURVERBAYES_REF: 29fef4e99a42652f7e545a85f30a628a0be186a2
            CURVERWEIGHTS_REF=${{ env.CURVERWEIGHTS_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
